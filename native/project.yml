name: PortTools
xcodeVersion: "15.4"
projectFormat: xcode15_3
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4
targets:
  PortTools:
    type: application
    platform: macOS
    sources:
      - path: PortTools
      - path: trial/Resources/PortTools.icns
        buildPhase: resources
      - path: Localization
        buildPhase: resources
    dependencies:
      - package: Sparkle
    preBuildScripts:
      - name: Build embedded Go core
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          repository_root="$(cd "$SRCROOT/.." && pwd)"
          helper_dir="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          portless_dir="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchServices"
          daemon_dir="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons"
          mkdir -p "$helper_dir"
          mkdir -p "$portless_dir" "$daemon_dir"
          cd "$repository_root/core"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=$MARKETING_VERSION" \
            -o "$helper_dir/port-tools-core" \
            .
          cd "$repository_root/portless-helper"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=$MARKETING_VERSION" \
            -o "$portless_dir/port-tools-portless-helper" \
            .
          cp "$repository_root/native/PortlessHelper.plist" "$daemon_dir/PortlessHelper.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.popcornnn.PortTools
        PRODUCT_NAME: Port Tools
        EXECUTABLE_NAME: PortTools
        PRODUCT_MODULE_NAME: PortTools
        INFOPLIST_FILE: trial/Info.plist
        CODE_SIGN_ENTITLEMENTS: trial/PortTools.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "28"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_VERSION: "5.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
        Release:
          ARCHS: arm64
          ONLY_ACTIVE_ARCH: NO
schemes:
  PortTools:
    build:
      targets:
        PortTools: all
    run:
      config: Debug
    archive:
      config: Release
